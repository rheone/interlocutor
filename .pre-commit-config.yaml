# git push origin <branch-name> --no-verify
# git commit --no-verify -m "commit"; git push --no-verify

# See https://pre-commit.com for more information.

# Pre-commit hook configuration.
# Install hooks:
#   pre-commit install
#
# Run on staged files:
#   pre-commit run
#
# Run on all files:
#   pre-commit run --all-files
#
# Update hook versions:
#   pre-commit autoupdate
#
# Skip specific hooks:
#   SKIP=hook-id pre-commit run --all-files

minimum_pre_commit_version: "4.0.0"
default_stages: [pre-commit]
fail_fast: true

repos:
  # ── Universal file normalization ───────────────────────────────
  # These hooks modify files into a consistent format before
  # any language-specific tools execute.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Normalize all text files to LF line endings.
      # (Use .gitattributes to define repository policy.)
      - id: mixed-line-ending
        args: [--fix=lf]

      # Ensure every text file ends with exactly one newline.
      - id: end-of-file-fixer

      # Remove trailing spaces.
      - id: trailing-whitespace

      # Validate YAML syntax.
      - id: check-yaml

      # Prevent accidental merge conflict markers.
      - id: check-merge-conflict

      # Prevent accidentally committing very large files.
      - id: check-added-large-files
        args: [--maxkb=512]

  # ── Markdown ───────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args:
          # Disable line length rule.
          - --disable
          - MD013

  # ── Spell checking ──────────────────────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          # Ignore common false positives and API names
          # (AtLeast/AtMost are Moq/JustMock call-verification methods,
          # statics is a common .NET term, ShouldBe is a Shouldly assertion method).
          - --ignore-words-list=fo,ect,atleast,atmost,statics,shouldbe

          # Also check filenames.
          - --check-filenames

        # Only check source and documentation files.
        types_or:
          - c#
          - python
          - javascript
          - ts
          - markdown
          - shell
          - yaml
          - json

        # Skip generated/vendor content.
        exclude: ^bootstrapreference/

  # ── .NET formatting (staged files only) ─────────────────────────
  # Analyzer warning gate is intentionally disabled for now: the codebase
  # still carries StyleCop structural violations (SA1402/SA1649/SA1201/...)
  # that `dotnet format` cannot auto-fix, so a --verify-no-changes gate can
  # never pass. Revisit once those are resolved.
  - repo: local
    hooks:
      # Fixes code-style violations (naming, modifiers, preferences)
      - id: dotnet-format-style
        name: dotnet format style
        entry: dotnet format style --include
        language: system
        types: [c#]
        pass_filenames: true
        exclude: ^bootstrapreference/

      # Disabled due to usage of modern c# versions not handled yet by csharpier.
      #- repo: local
      #  hooks:
      #    # CSharpier owns whitespace and layout formatting.
      #    - id: csharpier
      #      name: csharpier
      #      entry: dotnet csharpier
      #      language: system
      #      types: [c#]
      #      exclude: |
      #        (?x)(
      #          ^bootstrapreference/|
      #          Results\.cs$
      #        )

      # # Apply IDE/style fixes supported by dotnet format.
      # - id: dotnet-format-style
      #   name: dotnet format style
      #   entry: pwsh -NoProfile -File .githooks/format-style.ps1
      #   language: system
      #   types: [c#]
      #   exclude: ^bootstrapreference/

      # # Verify analyzer/code-quality rules.
      # # This hook should NOT modify files.
      # - id: dotnet-format-analyzers
      #   name: dotnet format analyzers
      #   entry: pwsh -NoProfile -File .githooks/format-analyzers.ps1
      #   language: system
      #   types: [c#]
      #   exclude: ^bootstrapreference/

  # ── Secret scanning ────────────────────────────────────────────
  # Run last since it is one of the slower hooks and does not
  # modify files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
