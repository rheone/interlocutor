name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Interlocutor.slnx

      - name: Build
        run: dotnet build Interlocutor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Interlocutor.slnx -c Release --no-build

  trim-compatibility:
    name: Trim compatibility (analyzer-level only - see documentation/trim-and-aot-support.md)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # This is now the only step in this job. It used to be a cheap early gate ahead of a slower
      # publish-and-run step that actually built and executed a trimmed sample end to end - that step,
      # and the runnable sample it depended on, are gone (the sample was replaced by
      # TutorialProject/TodoTasks.Api, which was never built with a trim-compat story in mind and isn't
      # verified trim-safe - see .scratch/tutorial-project/issues/19-ci-trim-compatibility-job-references-deleted-sample.md
      # for why this job wasn't simply repointed at it). A clean build here is necessary but not
      # sufficient: it catches a regression in the per-project trim analyzer, but it does not prove a
      # trimmed publish actually dispatches correctly at runtime the way the removed step did - see
      # documentation/trim-and-aot-support.md for the currently-accurate claim about what this repo's
      # trim-compatibility support actually verifies. It intentionally does not include IL3xxx (AOT)
      # codes: this library does not claim AOT compatibility, so gating on those codes would fail the
      # build over a promise this repo has explicitly chosen not to make yet.
      - name: Fail the build on any trim-analyzer regression in the shipping packages
        run: >-
          dotnet build Interlocutor.slnx -c Release
          -warnaserror:IL2026,IL2057,IL2060,IL2067,IL2068,IL2069,IL2070,IL2071,IL2072,IL2075,IL2080,IL2087,IL2090,IL2091
